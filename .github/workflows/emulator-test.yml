name: Emulator smoke test

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API level'
        required: false
        default: '34'

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Launch app on emulator (API ${{ github.event.inputs.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api }}
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            echo "=== LAUNCHING ==="
            adb shell am start -W -n com.neuanki.app/.ui.MainActivity
            sleep 25
            echo "=== PROCESS CHECK ==="
            PID=$(adb shell pidof com.neuanki.app | tr -d '\r\n ')
            if [ -n "$PID" ] && [ "$PID" != "" ]; then
              echo "APP ALIVE with pid=$PID"
            else
              echo "PROCESS_DEAD"
            fi
            echo "=== CRASH BUFFER ==="
            adb logcat -d -b crash | tee crash_report.txt
            echo "=== SCREENSHOT ==="
            adb exec-out screencap -p > screenshot.png || true
            CRASHES=$(grep -c "FATAL EXCEPTION" crash_report.txt || true)
            if [ "$CRASHES" -gt 0 ]; then
              echo "RESULT: APP CRASHED"
              exit 1
            else
              echo "RESULT: APP RUNNING OK"
            fi

      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api${{ github.event.inputs.api }}-logs
          path: |
            crash_report.txt
            screenshot.png
