plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neuanki.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.neuanki.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // امضای release با کلید debug تا خروجی GitHub Actions مستقیم قابل نصب باشد
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ادیوری — تبلیغ همسان صفحهٔ اول
    implementation 'com.adivery:sdk:4.9.0'
    // خواندن GAID برای هدف‌گیری بهتر تبلیغ (اختیاری ولی توصیه‌شدهٔ ادیوری)
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    // پشتیبانی از فایل‌های جدید apkg انکی (collection.anki21b فشرده با zstd) — جاوا خالص
    implementation 'io.airlift:aircompressor:0.27'
}
